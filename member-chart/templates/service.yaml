apiVersion: v1
kind: Service

metadata:
  name: member-service
  namespace: deploy-test
  labels:
    app: member

spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
  selector:
    app: member